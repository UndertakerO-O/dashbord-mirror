services:
  database:
    image: postgres:16-alpine
    container_name: dashboard-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    ports:
      - "5432:5432"
    volumes:
      - dashboard-postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: dashboard-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./backend
    container_name: dashboard-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      FRONTEND_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://dashboard:dashboard@database:5432/dashboard?schema=public
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8080/auth/github/callback}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@dashboard.local
    ports:
      - "8080:8000"
    depends_on:
      - database
      - mailpit

  frontend:
    build:
      context: ./frontend
    container_name: dashboard-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dashboard-postgres-data:
